# Validates lessons/*.json (runs every snippet with Python) and publishes the site to GitHub Pages on every push to main.
# If a lesson file is broken, this run fails and the live site keeps the previous version.
name: Validate and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # same major version as Pyodide 0.26 in the browser
      - name: Validate lessons and build site
        run: node scripts/build.mjs && node --test "tests/*.test.mjs"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
